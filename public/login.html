<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Kelly Online</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/auth.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">Kelly Online</a><nav></nav></header>
  <main class="wrap narrow">
    <div class="card">
      <h1>Sign in</h1>
      <div id="msg"></div>
      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p><button class="btn" type="submit">Sign in</button></p>
      </form>
      <p class="small"><a href="/reset.html">Forgotten your password?</a> · <a href="/register.html">Create an account</a></p>
    </div>
  </main>
</body>
</html>
