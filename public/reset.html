<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset access — Kelly Online</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#005eb8">
  <script src="/pwa-early.js"></script>
  <script type="module" src="/auth.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">Kelly Online</a><nav></nav></header>
  <main class="wrap narrow">
    <div class="card">
      <div id="msg"></div>
      <form id="request-reset-form">
        <h1>Reset your password</h1>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p><button class="btn" type="submit">Send reset link</button></p>
      </form>
      <form id="do-reset-form" class="hidden">
        <h1>Choose a new password</h1>
        <label for="password">New password</label>
        <p class="hint">At least 10 characters.</p>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
        <p><button class="btn" type="submit">Set new password</button></p>
      </form>
      <p class="small"><a href="/login.html">Back to sign in</a></p>
    </div>
  </main>
</body>
</html>
